function calcIVA(base, pct){
  return Math.round(parseFloat(base)*pct/100*100)/100;
}

// Genera asientos con IVA desglosado
function generarAsientosConIVA(asiento){
  var cat = asiento.cat || '';
  var ivaInfo = CATS_IVA[cat];
  if(!ivaInfo || !ivaInfo.lleva || asiento.sinIVA) return [asiento];
  
  var base = Math.round(asiento.importe / (1 + ivaInfo.pct/100) * 100) / 100;
  var iva = Math.round((asiento.importe - base) * 100) / 100;
  
  if(ivaInfo.tipo === 'repercutido'){
    // Venta: 570/472 D, 700 H, 477 H
    return [
      Object.assign({}, asiento, {importe: asiento.importe, debe: asiento.debe, haber: asiento.haber, concepto: asiento.concepto}),
      {id: asiento.id+'_iva', fecha: asiento.fecha, concepto: 'IVA repercutido - '+asiento.concepto, importe: iva, debe: asiento.debe, haber: '477', cat: 'IVA repercutido', tipo: 'iva_rep', origen: asiento.origen, confirmado: asiento.confirmado, esIVA: true},
    ];
  } else {
    // Gasto: 629 D + 472 D, 572 H
    return [
      Object.assign({}, asiento, {importe: base}),
      {id: asiento.id+'_iva', fecha: asiento.fecha, concepto: 'IVA soportado - '+asiento.concepto, importe: iva, debe: '472', haber: asiento.haber, cat: 'IVA soportado', tipo: 'iva_sop', origen: asiento.origen, confirmado: asiento.confirmado, esIVA: true},
    ];
  }
}

function clasificarMovimiento(mov){
  var txt=(mov.concepto||'').toUpperCase();
  var cod=(mov.codigo||'').trim();
  var importe=parseFloat(mov.importe)||0;
  var esGasto=importe<0;

  for(var i=0;i<REGLAS_BBVA.length;i++){
    var r=REGLAS_BBVA[i];
    if(r.cod===cod&&txt.indexOf(r.patron)>=0){
      if(esGasto&&r.tipo==='ingreso') continue;
      if(!esGasto&&r.tipo==='gasto') continue;
      return {debe:r.debe,haber:r.haber,cat:r.cat,tipo:r.tipo};
    }
  }
  if(esGasto) return {debe:'629',haber:'572',cat:'Otros gastos',tipo:'gasto'};
  return {debe:'572',haber:'700',cat:'Otros ingresos',tipo:'ingreso'};
}

// ===== PDF EXTRACTOR =====
function extractPDFText(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(ev){
      var arr=new Uint8Array(ev.target.result);
      pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
        var pages=[];
        for(var i=1;i<=pdf.numPages;i++) pages.push(i);
        return Promise.all(pages.map(function(pn){
          return pdf.getPage(pn).then(function(page){
            return page.getTextContent().then(function(tc){
              return tc.items.map(function(item){return item.str;}).join(' ');
            });
          });
        }));
      }).then(function(texts){resolve(texts.join('\n'));}).catch(reject);
    };
    reader.readAsArrayBuffer(file);
  });
}

function parseBBVA(text){
  var movs=[];
  var upperText=text.toUpperCase();

  PATRONES_BBVA.forEach(function(pat){
    var search=pat.patron;
    var idx=0;
    while((idx=upperText.indexOf(search,idx))!==-1){
      // Buscar fecha en los 400 chars anteriores
      var before=text.substring(Math.max(0,idx-400),idx);
      var after=text.substring(idx,idx+400);
      var dates=before.match(/\d{2}\/\d{2}\/\d{4}/g);
      if(!dates||!dates.length){idx+=search.length;continue;}
      var fecha=dates[dates.length-1];

      // Extraer importe: primer numero con formato X.XXX,XX o XX,XX en el contexto
      var amtReg=/(\d{1,3}(?:\.\d{3})*,\d{2})/g;
      var amounts=[],m;
      var ctx=after;
      while((m=amtReg.exec(ctx))!==null){
        var val=parseFloat(m[1].replace(/\./g,'').replace(',','.'));
        if(val>=1&&val<=99999) amounts.push(val);
      }
      if(!amounts.length){idx+=search.length;continue;}
      var importe=amounts[0];

      // Evitar duplicados (misma fecha e importe)
      var dup=movs.find(function(mv){
        return mv.fecha===fecha&&Math.abs(mv.importe-importe)<0.01&&mv.codigo===pat.codigo;
      });
      if(!dup){
        // Extraer concepto: texto entre el patron y el primer importe
        var concepto=after.slice(0,after.search(/(\d{1,3}(?:\.\d{3})*,\d{2})/)||60).trim().slice(0,80);
        if(!concepto) concepto=pat.patron;
        movs.push({
          id:gid(),
          fecha:fecha,
          codigo:pat.codigo,
          concepto:concepto||pat.patron,
          importe:importe,
          tipo_orig:pat.tipo,
          confirmado:false
        });
      }
      idx+=search.length;
    }
  });

  // Ordenar por fecha
  movs.sort(function(a,b){
    return a.fecha.split('/').reverse().join('').localeCompare(b.fecha.split('/').reverse().join(''));
  });
  return movs;
}

// ===== PARSER CSV BBVA =====
// Formato: Fecha Proceso,Fecha Valor,Código,Concepto,Observaciones,Oficina,Importe,Saldo,Remesa
function parseCSVLine(line){
  var cols=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
    else{cur+=ch;}
  }
  cols.push(cur.trim());
  return cols;
}

function parseCSVBBVA(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<2) return [];
  var headers=parseCSVLine(lines[0]).map(function(h){return h.toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').trim();});
  var iF=headers.findIndex(function(h){return /fecha/.test(h)&&!/valor/.test(h);});
  var iC=headers.findIndex(function(h){return h==='codigo'||h==='code';});
  var iCon=headers.findIndex(function(h){return h==='concepto';});
  var iObs=headers.findIndex(function(h){return h==='observaciones';});
  var iImp=headers.findIndex(function(h){return h==='importe';});
  if(iF<0||iImp<0) return [];
  var movs=[];
  for(var i=1;i<lines.length;i++){
    var cols=parseCSVLine(lines[i]);
    if(cols.length<=iImp) continue;
    var fechaStr=cols[iF]||'';
    var fm=fechaStr.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(!fm) continue;
    var importe=parseFloat(cols[iImp]);
    if(isNaN(importe)) continue;
    var codigo=iC>=0?(cols[iC]||''):'';
    var concepto=iCon>=0?(cols[iCon]||''):'';
    var obs=iObs>=0?(cols[iObs]||''):'';
    // Concepto para clasificar: combina Concepto (tipo BBVA) + Observaciones (detalle)
    var conceptoClasif=(concepto+' '+obs).toUpperCase();
    movs.push({id:gid(),fecha:fechaStr,codigo:codigo,concepto:conceptoClasif,benef:obs||concepto,importe:importe});
  }
  return movs;
}

// Map 3-digit PGC code to 10-char ContaPlus subcuenta code
function cuentaCP(c){
  if(c==='477') return '4770000021'; // IVA repercutido 21%
  if(c==='472') return '4720000021'; // IVA soportado 21%
  return (c||'000').padEnd(10,'0').slice(0,10);
}

// Build 48-char tail for xDiario.txt line
// ivaPct100: IVA percentage * 100 (e.g. 2100 for 21%, 0 for none)
function buildTail(ivaPct100){
  var f=ivaPct100>0?String(ivaPct100).padStart(5,' ').slice(-5):'    0';
  return '0                       0'+f+'    0             ';
}

// Build one fixed-width line for xDiario.txt (137 chars)
function buildDiarioLine(asienNum,fechaCP,debeCP,haberCP,amtCents,concepto,ivaPct100){
  var asienStr=String(asienNum).padStart(6,'0');
  var debeStr=(debeCP||'').padEnd(10,' ').slice(0,10);
  var haberStr=(haberCP||'').padEnd(10,' ').slice(0,10);
  var amtStr=String(Math.max(0,Math.round(amtCents))).padStart(15,' ').slice(-15);
  var concStr=(concepto||'').slice(0,38).padEnd(38,' ');
  return asienStr+fechaCP+debeStr+'  '+haberStr+amtStr+concStr+buildTail(ivaPct100);
}

  var sload=useState(false);var loading=sload[0],setLoading=sload[1];

  var gastoForm=sgf[0],setGastoForm=sgf[1];
  var tRef=useRef(null);

  function msg(m,t){setToast({m:m,t:t||'ok'});clearTimeout(tRef.current);tRef.current=setTimeout(function(){setToast(null);},3000);}
  function saveAsientos(list){setAsientos(list);localStorage.setItem(SK_CONT,JSON.stringify(list));}

  useEffect(function(){
    if(!logged) return;
    var saved=localStorage.getItem(SK_CONT);
    if(saved){try{setAsientos(JSON.parse(saved));}catch(e){}}
  },[logged]);

  if(!logged) return h(Login,{onLogin:function(){localStorage.setItem('cont_logged','1');setLogged(true);}});

  var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var mesNum=parseInt(mes)||1,anioNum=parseInt(anio)||2026;

  // Filtrar asientos del periodo
  var asientosFiltrados=asientos.filter(function(a){
    if(!a.fecha) return false;
    var parts=a.fecha.split('/');
    if(parts.length===3){
      return parseInt(parts[1])===mesNum&&parseInt(parts[2])===anioNum;
    }
    return false;
  }).sort(function(a,b){
    var da=a.fecha.split('/').reverse().join('');
    var db=b.fecha.split('/').reverse().join('');
    return da.localeCompare(db);
  });

  // Calculos balance
  var totalIngresos=asientosFiltrados.filter(function(a){return a.tipo==='ingreso';}).reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
  var totalGastos=asientosFiltrados.filter(function(a){return a.tipo==='gasto';}).reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
  var resultado=totalIngresos-totalGastos;

  // IVA del periodo
  var ivaRepercutido=asientosFiltrados.filter(function(a){return a.cat==='IVA repercutido';}).reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
  var ivaSoportado=asientosFiltrados.filter(function(a){return a.cat==='IVA soportado';}).reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
  var ivaLiquidar=ivaRepercutido-ivaSoportado;
  var trimestre=Math.ceil(mesNum/3);

  // Agrupar por cuenta para balance
  var cuentas={};
  asientosFiltrados.forEach(function(a){
    if(!cuentas[a.debe]) cuentas[a.debe]={cuenta:a.debe,debe:0,haber:0};
    if(!cuentas[a.haber]) cuentas[a.haber]={cuenta:a.haber,debe:0,haber:0};
    cuentas[a.debe].debe+=Math.abs(parseFloat(a.importe)||0);
    cuentas[a.haber].haber+=Math.abs(parseFloat(a.importe)||0);
  });

  function procesarPDF(file){
    setLoading(true);
    extractPDFText(file).then(function(text){
      var movs=parseBBVA(text);
      if(!movs.length){msg('No se encontraron movimientos en el PDF','err');setLoading(false);return;}
      var nuevosAsientos=movs.map(function(mov){
        var clas=clasificarMovimiento(mov);
        return {
          id:mov.id,
          fecha:mov.fecha,
          concepto:mov.concepto,
          importe:Math.abs(mov.importe),
          debe:clas.debe,
          haber:clas.haber,
          cat:clas.cat,
          tipo:clas.tipo,
          origen:'banco',
          confirmado:false
        };
      });
      saveAsientos(asientos.concat(nuevosAsientos));
      msg(nuevosAsientos.length+' asientos importados del banco');
      setLoading(false);
      setVista('diario');
    }).catch(function(e){msg('Error al leer PDF','err');setLoading(false);});
  }

  function procesarCSV(file){
    setLoading(true);
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var movs=parseCSVBBVA(ev.target.result);
        if(!movs.length){msg('No se encontraron movimientos en el CSV','err');setLoading(false);return;}
        // Deduplicar: misma fecha, mismo importe, mismo código
        var keys={};
        asientos.forEach(function(a){keys[a.fecha+'|'+Math.abs(parseFloat(a.importe)||0)]=true;});
        var nuevosMovs=movs.filter(function(mv){return !keys[mv.fecha+'|'+Math.abs(parseFloat(mv.importe)||0)];});
        var nuevosAsientos=[];
        nuevosMovs.forEach(function(mov){
          var clas=clasificarMovimiento(mov);
          var lista=generarAsientosBanco(mov,clas);
          nuevosAsientos=nuevosAsientos.concat(lista);
        });
        saveAsientos(asientos.concat(nuevosAsientos));
        msg(nuevosMovs.length+' movimientos importados ('+nuevosAsientos.length+' asientos)');
        setLoading(false);
        setVista('diario');
      }catch(e){msg('Error al leer el CSV: '+e.message,'err');setLoading(false);}
    };
    reader.onerror=function(){msg('Error al leer el CSV','err');setLoading(false);};
    reader.readAsText(file,'UTF-8');
  }

  function guardarGasto(){
    if(!gastoForm.fecha||!gastoForm.concepto||!gastoForm.importe){msg('Rellena todos los campos','err');return;}
    var base={
      id:gid(),
      fecha:gastoForm.fecha.split('-').reverse().join('/'),
      concepto:gastoForm.concepto,
      importe:Math.abs(parseFloat(gastoForm.importe)||0),
      debe:gastoForm.debe,
      haber:gastoForm.haber,
      cat:gastoForm.cat,
      tipo:parseFloat(gastoForm.importe)>0?'gasto':'ingreso',
      origen:'manual',
      confirmado:false,
      sinIVA:!gastoForm.conIVA
    };
    var nuevos=gastoForm.conIVA?generarAsientosConIVA(base):[base];
    saveAsientos(asientos.concat(nuevos));
    setShowGasto(false);
    setGastoForm({fecha:'',concepto:'',importe:'',debe:'629',haber:'572',cat:'Gasto manual'});
    msg('Asiento guardado');
  }

  function exportarCSV(){
    var rows=[['Fecha','Concepto','Categoria','Debe','Cuenta Debe','Haber','Cuenta Haber','Importe','Tipo','Origen']];
    asientosFiltrados.forEach(function(a){
      rows.push([a.fecha,'"'+a.concepto+'"',a.cat,a.debe,'"'+(PGC[a.debe]||'')+'"',a.haber,'"'+(PGC[a.haber]||'')+'"',a.importe,a.tipo,a.origen||'']);
    });
    var csv=rows.map(function(r){return r.join(';');}).join('\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='libro_diario_'+mes+'_'+anio+'.csv';a.click();
    URL.revokeObjectURL(url);
    msg('CSV exportado');
  }

  function exportarContaPlus(){
    if(!asientosFiltrados.length){msg('No hay asientos en el periodo','err');return;}
    var sorted=asientosFiltrados.slice().sort(function(a,b){
      var da=(a.fecha||'').split('/').reverse().join('');
      var db=(b.fecha||'').split('/').reverse().join('');
      return da.localeCompare(db)||(a.id<b.id?-1:1);
    });
    var diarioLines=[];
    var subctas={};
    var asienNum=1;
    sorted.forEach(function(a){
      var p=(a.fecha||'').split('/');
      var fechaCP=p.length===3?p[2]+p[1]+p[0]:'00000000';
      var debeCP=cuentaCP(a.debe);
      var haberCP=cuentaCP(a.haber);
      var amtCents=Math.round(parseFloat(a.importe||0)*100);
      var conc=(a.concepto||'').slice(0,38);
      // IVA% only on the HABER IVA account line
      var ivaPct100=0;
      if(a.haber==='477'||a.haber==='472') ivaPct100=2100;
      diarioLines.push(buildDiarioLine(asienNum,fechaCP,debeCP,'',amtCents,conc,0));
      diarioLines.push(buildDiarioLine(asienNum,fechaCP,'',haberCP,amtCents,conc,ivaPct100));
      subctas[debeCP]=PGC[a.debe]||('Cuenta '+a.debe);
      subctas[haberCP]=PGC[a.haber]||('Cuenta '+a.haber);
      asienNum++;
    });
    function dlFile(filename,content){
      var blob=new Blob([content],{type:'text/plain;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var el=document.createElement('a');
      el.href=url;el.download=filename;el.click();
      URL.revokeObjectURL(url);
    }
    var subctsContent=Object.keys(subctas).sort().map(function(code){
      return code+'  '+(subctas[code]||'').slice(0,40).padEnd(40,' ');
    }).join('\r\n');
    var diarioContent=diarioLines.join('\r\n');
    dlFile('xSubCta.txt',subctsContent);
    setTimeout(function(){dlFile('xDiario.txt',diarioContent);},400);
    msg(sorted.length+' asientos exportados a ContaPlus');
  }

      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
        h('div',null,
          h('div',{style:{fontSize:11,fontWeight:600,letterSpacing:'.12em',color:'#64748B'}},'COMAR'),
          h('div',{style:{fontSize:22,fontWeight:700,color:'#F1F5F9'}},'Contabilidad')
        ),
        h('div',{style:{display:'flex',gap:8}},
          h('a',{href:'/',style:{background:'#1E293B',border:'1px solid #334155',color:'#94A3B8',padding:'7px 12px',borderRadius:10,fontSize:11,fontWeight:600,textDecoration:'none'}},'Entregas'),
          h('button',{onClick:function(){localStorage.removeItem('cont_logged');setLogged(false);},style:{background:'transparent',border:'1px solid #EF4444',color:'#EF4444',padding:'7px 12px',borderRadius:10,fontSize:11,fontWeight:600,cursor:'pointer'}},'Salir')
        )

      // Periodo
      h('div',{style:{display:'flex',gap:8,marginBottom:10}},

          ['01','02','03','04','05','06','07','08','09','10','11','12'].map(function(m){return h('option',{key:m,value:m},MESES[parseInt(m)-1]);})
        ),

      // Tabs

          return h('button',{key:v,onClick:function(){setVista(v);},style:{flex:1,padding:'7px 2px',borderRadius:10,border:'none',cursor:'pointer',fontSize:10,fontWeight:600,background:vista===v?'#3B82F6':'#1E293B',color:vista===v?'#fff':'#64748B'}},TABLABELS[v]);
        })

    // Content
    h('div',{style:{flex:1,overflowY:'auto',padding:'16px 16px 50px'}},
