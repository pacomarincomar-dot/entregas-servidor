function calcIVA(base, pct){
  return Math.round(parseFloat(base)*pct/100*100)/100;
}

// Genera asientos con IVA desglosado
function generarAsientosConIVA(asiento){
  var cat = asiento.cat || '';
  var ivaInfo = CATS_IVA[cat];
  if(!ivaInfo || !ivaInfo.lleva || asiento.sinIVA) return [asiento];
  
  var base = Math.round(asiento.importe / (1 + ivaInfo.pct/100) * 100) / 100;
  var iva = Math.round((asiento.importe - base) * 100) / 100;
  
  if(ivaInfo.tipo === 'repercutido'){
    // Venta: 570/472 D, 700 H, 477 H
    return [
      Object.assign({}, asiento, {importe: asiento.importe, debe: asiento.debe, haber: asiento.haber, concepto: asiento.concepto}),
      {id: asiento.id+'_iva', fecha: asiento.fecha, concepto: 'IVA repercutido - '+asiento.concepto, importe: iva, debe: asiento.debe, haber: '477', cat: 'IVA repercutido', tipo: 'iva_rep', origen: asiento.origen, confirmado: asiento.confirmado, esIVA: true},
    ];
  } else {
    // Gasto: 629 D + 472 D, 572 H
    return [
      Object.assign({}, asiento, {importe: base}),
      {id: asiento.id+'_iva', fecha: asiento.fecha, concepto: 'IVA soportado - '+asiento.concepto, importe: iva, debe: '472', haber: asiento.haber, cat: 'IVA soportado', tipo: 'iva_sop', origen: asiento.origen, confirmado: asiento.confirmado, esIVA: true},
    ];
  }
}

function clasificarMovimiento(mov){

  var cod=(mov.codigo||'').trim();
  var esGasto=(mov.tipo_orig==='gasto')||cod==='00120'||cod==='00379'||cod==='00326'||cod==='00321'||cod==='00734'||cod==='00925'||cod==='00129'||cod==='00469'||cod==='00039'||cod==='00022';

  // Ingresos en efectivo: ya contabilizados como venta desde Caja
  // En el BBVA solo reflejamos el traspaso de caja al banco: 572 D / 570 H
  if(cod==='00009') return {debe:'572',haber:'570',cat:'Ingreso efectivo - traspaso caja banco',tipo:'traspaso'};
  if(cod==='00007'&&!esGasto) return {debe:'572',haber:'430',cat:'Cobro cliente',tipo:'ingreso'};

  // Gastos por codigo
  if(cod==='00379') return {debe:'521',haber:'572',cat:'Amortizacion prestamo',tipo:'gasto'};
  if(cod==='00326') return {debe:'631',haber:'572',cat:'Impuestos y tributos',tipo:'gasto'};
  if(cod==='00321') return {debe:'642',haber:'572',cat:'Seguridad Social autonomo',tipo:'gasto'};
  if(cod==='00120') return {debe:'629',haber:'572',cat:'Gastos tarjeta',tipo:'gasto'};
  if(cod==='00039') return {debe:'626',haber:'572',cat:'Servicios bancarios',tipo:'gasto'};
  if(cod==='00022') return {debe:'572',haber:'572',cat:'Traspaso interno',tipo:'traspaso'};

  // Gastos por concepto cuando el codigo no es definitivo
  if(txt.indexOf('ALQUILER')>=0||cod==='00734') return {debe:'621',haber:'572',cat:'Arrendamiento',tipo:'gasto'};
  if(txt.indexOf('ELECTRICIDAD')>=0||txt.indexOf('REPSOL')>=0||cod==='00129') return {debe:'628',haber:'572',cat:'Suministros',tipo:'gasto'};
  if(txt.indexOf('SEGURO')>=0||txt.indexOf('ADESLAS')>=0||txt.indexOf('MAPFRE')>=0||cod==='00469') return {debe:'625',haber:'572',cat:'Seguros',tipo:'gasto'};
  if(txt.indexOf('TELECOMUNICACION')>=0||txt.indexOf('MOVISTAR')>=0||txt.indexOf('VODAFONE')>=0||txt.indexOf('ORANGE')>=0||cod==='00925') return {debe:'629',haber:'572',cat:'Telecomunicaciones',tipo:'gasto'};

  // Fallback
  if(esGasto) return {debe:'629',haber:'572',cat:'Otros gastos',tipo:'gasto'};
  return {debe:'572',haber:'700',cat:'Otros ingresos',tipo:'ingreso'};

    ];

// ===== PDF EXTRACTOR =====
function extractPDFText(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(ev){
      var arr=new Uint8Array(ev.target.result);
      pdfjsLib.getDocument({data:arr}).promise.then(function(pdf){
        var pages=[];
        for(var i=1;i<=pdf.numPages;i++) pages.push(i);
        return Promise.all(pages.map(function(pn){
          return pdf.getPage(pn).then(function(page){
            return page.getTextContent().then(function(tc){
              return tc.items.map(function(item){return item.str;}).join(' ');
            });
          });
        }));
      }).then(function(texts){resolve(texts.join('\n'));}).catch(reject);
    };
    reader.readAsArrayBuffer(file);
  });
}

function parseBBVA(text){
  var movs=[];
  var upperText=text.toUpperCase();

  PATRONES_BBVA.forEach(function(pat){
    var search=pat.patron;
    var idx=0;
    while((idx=upperText.indexOf(search,idx))!==-1){
      var before=text.substring(Math.max(0,idx-400),idx);
      var after=text.substring(idx,idx+600);
      var dates=before.match(/\d{2}\/\d{2}\/\d{4}/g);
      if(!dates||!dates.length){idx+=search.length;continue;}
      var fecha=dates[dates.length-1];

      // Buscar importe negativo en concepto (cargos): formato "-43,4 EU" o "-124,60 EUR"
      var negReg=/-(\d{1,3}(?:\.\d{3})*,\d{1,2})\s*EU/g;
      var negMatches=[],nm;
      negReg.lastIndex=0;
      while((nm=negReg.exec(after))!==null){
        var val=parseFloat(nm[1].replace(/\./g,'').replace(',','.'));
        if(val>=0.01&&val<=99999) negMatches.push(val);
      }

      // Buscar importe positivo (abonos): ignorar saldos grandes >9999
      var posReg=/\+?(\d{1,3}(?:\.\d{3})*,\d{2})\s*EU/g;
      var posMatches=[],pm2;
      posReg.lastIndex=0;
      while((pm2=posReg.exec(after))!==null){
        var pval=parseFloat(pm2[1].replace(/\./g,'').replace(',','.'));
        if(pval>=0.01&&pval<=9999) posMatches.push(pval);
      }

      var importe=0;
      if(pat.tipo==='gasto'&&negMatches.length>0) importe=negMatches[0];
      else if(pat.tipo==='ingreso'&&posMatches.length>0) importe=posMatches[0];
      else if(negMatches.length>0) importe=negMatches[0];
      else if(posMatches.length>0) importe=posMatches[0];

      if(!importe||importe<0.01){idx+=search.length;continue;}

      var dup=movs.find(function(mv){
        return mv.fecha===fecha&&Math.abs(mv.importe-importe)<0.01&&mv.codigo===pat.codigo;
      });
      if(!dup){
        var concepto=after.slice(0,120).replace(/[\r\n]+/g,' ').trim().slice(0,80);
        if(!concepto) concepto=pat.patron;
        movs.push({id:gid(),fecha:fecha,codigo:pat.codigo,concepto:concepto,importe:importe,tipo_orig:pat.tipo,confirmado:false});
      }
      idx+=search.length;
    }
  });

  movs.sort(function(a,b){
    return a.fecha.split('/').reverse().join('').localeCompare(b.fecha.split('/').reverse().join(''));
  });
  return movs;
}

// ===== CSV BBVA PARSER =====
function parseCSVLine(line){
  var cols=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
    else{cur+=ch;}
  }
  cols.push(cur.trim());
  return cols;
}

function parseCSVBBVA(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<2) return [];
  var headers=parseCSVLine(lines[0]).map(function(h){return h.toLowerCase().replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').trim();});
  var iF=headers.findIndex(function(h){return /fecha/.test(h)&&!/valor/.test(h);});
  var iC=headers.findIndex(function(h){return h==='codigo'||h==='code';});
  var iCon=headers.findIndex(function(h){return h==='concepto';});
  var iObs=headers.findIndex(function(h){return h==='observaciones';});
  var iImp=headers.findIndex(function(h){return h==='importe';});
  if(iF<0||iImp<0) return [];
  var movs=[];
  for(var i=1;i<lines.length;i++){
    var cols=parseCSVLine(lines[i]);
    if(cols.length<=iImp) continue;
    var fechaStr=cols[iF]||'';
    var fm=fechaStr.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(!fm) continue;
    var importe=parseFloat(cols[iImp]);
    if(isNaN(importe)) continue;
    var codigo=iC>=0?(cols[iC]||''):'';
    var concepto=iCon>=0?(cols[iCon]||''):'';
    var obs=iObs>=0?(cols[iObs]||''):'';
    var conceptoClasif=(concepto+' '+obs).toUpperCase();
    movs.push({id:gid(),fecha:fechaStr,codigo:codigo,concepto:conceptoClasif,benef:obs||concepto,importe:importe});
  }
  return movs;
}

  // Exportar formato Contaplus xDiario.txt + xSubCta.txt
  // Estructura correcta: un asiento = varias lineas debe/haber bajo el mismo numero
  function exportarContaplus(){
    if(!asientosFiltrados.length){msg('No hay asientos en este periodo','err');return;}

    // Agrupar por id base (factura base + sus lineas de IVA)
    var grupos={};
    var ordenGrupos=[];
    asientosFiltrados.forEach(function(a){
      var idBase=a.id.replace(/_iva\d*$/,'').replace(/_liq.*$/,'').replace(/_iva$/,'');
      if(!grupos[idBase]){grupos[idBase]=[];ordenGrupos.push(idBase);}
      grupos[idBase].push(a);
    });

    var lineasDiario=[];
    var subcuentasUsadas={};
    var numAsiento=(confSub._ultimoAsiento||0)+1;

    function padImp(n,len){
      var cents=Math.round(Math.abs(parseFloat(n)||0)*100);
      return String(cents).padStart(len,' ');
    }
    function fmtSub(cod){
      return cod?getSubcuenta(cod).padEnd(12,' '):'            ';
    }
    function fmtConc(s){
      return (s||'').replace(/[^\x20-\x7E]/g,'').slice(0,25).padEnd(25,' ');
    }
    function fmtFecCP(f){
      var p=f.split('/');
      return (p[2]||'2026')+(p[1]||'01').padStart(2,'0')+(p[0]||'01').padStart(2,'0');
    }
    function linea(num,f,debe,haber,imp,conc,base,esIVA){
      var nStr=String(num).padStart(6,'0');
      var debeStr=debe?getSubcuenta(debe).slice(0,10):'          ';
      var haberStr=haber?getSubcuenta(haber).slice(0,10):'          ';
      var cents=Math.round(Math.abs(parseFloat(imp)||0)*100);
      var impStr=String(cents).padStart(15,' ');
      var concStr=(conc||'').replace(/[^\x20-\x7E]/g,'').slice(0,38).padEnd(38,' ');
      var ivaStr=esIVA?' 2100':'    0';
      var tail='0                       0'+ivaStr+'    0             ';
      return nStr+fmtFecCP(f)+debeStr+'  '+haberStr+impStr+concStr+tail;
    }
    function regSub(cod,nom){
      if(!cod)return;
      var sub=getSubcuenta(cod);
      if(!subcuentasUsadas[sub])subcuentasUsadas[sub]={cod:sub,nom:nom||PGC[cod]||'Cuenta '+cod};
    }

    ordenGrupos.forEach(function(idBase){
      var grupo=grupos[idBase];
      if(!grupo||!grupo.length)return;
      var linIVARep=grupo.filter(function(a){return a.cat==='IVA repercutido';});
      var linIVASop=grupo.filter(function(a){return a.cat==='IVA soportado';});
      var linBase=grupo.filter(function(a){return !a.esIVA&&a.cat!=='IVA repercutido'&&a.cat!=='IVA soportado';});
      var fecha=grupo[0].fecha;
      var conc=grupo[0].concepto;

      if(linIVARep.length>0){
        // VENTA con IVA: DEBE 570 total / HABER 700 base / HABER 477 cuota
        var base=linBase.reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
        var ivaR=linIVARep.reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
        var total=base+ivaR;
        var ctaVenta=linBase[0]?linBase[0].haber:'700';
        lineasDiario.push(linea(numAsiento,fecha,'570',null,total,conc,null,false));
        lineasDiario.push(linea(numAsiento,fecha,null,ctaVenta,base,conc,null,false));
        lineasDiario.push(linea(numAsiento,fecha,null,'477',ivaR,conc,base,true));
        regSub('570');regSub(ctaVenta);regSub('477');

      } else if(linIVASop.length>0){
        // GASTO con IVA: DEBE cta_gasto base / DEBE 472 iva / HABER 572 total
        var baseG=linBase.reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
        var ivaS=linIVASop.reduce(function(s,a){return s+Math.abs(parseFloat(a.importe)||0);},0);
        var totalG=baseG+ivaS;
        var ctaGasto=linBase[0]?linBase[0].debe:'629';
        lineasDiario.push(linea(numAsiento,fecha,ctaGasto,null,baseG,conc,null,false));
        lineasDiario.push(linea(numAsiento,fecha,'472',null,ivaS,conc,baseG,true));
        lineasDiario.push(linea(numAsiento,fecha,null,'572',totalG,conc,null,false));
        regSub(ctaGasto);regSub('472');regSub('572');

      } else {
        // APUNTE SIMPLE (traspaso, SS, prestamo...): DEBE / HABER
        linBase.forEach(function(a){
          var imp=Math.abs(parseFloat(a.importe)||0);
          if(imp<=0)return;
          if(a.debe)lineasDiario.push(linea(numAsiento,fecha,a.debe,null,imp,conc,null,false));
          if(a.haber)lineasDiario.push(linea(numAsiento,fecha,null,a.haber,imp,conc,null,false));
          regSub(a.debe);regSub(a.haber);
        });
      }
      numAsiento++;
    });

    // xDiario.txt
    var blobD=new Blob([lineasDiario.join('\r\n')],{type:'text/plain;charset=windows-1252'});
    var urlD=URL.createObjectURL(blobD);
    var aD=document.createElement('a');
    aD.href=urlD;aD.download='xDiario.txt';aD.click();
    URL.revokeObjectURL(urlD);

    // xSubCta.txt
    setTimeout(function(){
      var linSub=Object.values(subcuentasUsadas).map(function(s){
        return s.cod.padEnd(12,' ')+s.nom.replace(/[^\x20-\x7E]/g,'').slice(0,40).padEnd(40,' ');
      });
      var blobS=new Blob([linSub.join('\r\n')],{type:'text/plain;charset=windows-1252'});
      var urlS=URL.createObjectURL(blobS);
      var aS=document.createElement('a');
      aS.href=urlS;aS.download='xSubCta.txt';aS.click();
      URL.revokeObjectURL(urlS);
      msg('Exportados xDiario.txt y xSubCta.txt para Contaplus Elite');
      // Actualizar ultimo numero de asiento exportado
      var nuevo=Object.assign({},confSub,{_ultimoAsiento:numAsiento-1});
      saveConfSub(nuevo);
    },500);
  }

          h('div',{style:{display:'flex',gap:8}},
            h('button',{onClick:function(){
              saveAsientos(asientos.map(function(a){return a.id===editAsiento.id?editAsiento:a;}));
              setEditAsiento(null);msg('Asiento actualizado');
            },className:'btnP',style:{flex:2}},'Guardar cambios'),
            h('button',{onClick:function(){
              if(confirm('Eliminar este asiento?')){
                saveAsientos(asientos.filter(function(a){return a.id!==editAsiento.id;}));
                setEditAsiento(null);msg('Asiento eliminado');
              }
            },style:{flex:1,background:'transparent',border:'1px solid #EF4444',borderRadius:14,color:'#EF4444',fontSize:13,fontWeight:600,cursor:'pointer',padding:'14px'}},'Borrar')
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
